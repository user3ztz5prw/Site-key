<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key System</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0f;
      color: white;
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 35px;
      text-align: center;
      background: #15151c;
      border: 1px solid #292936;
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(0, 0, 0, .5);
    }

    h1 {
      margin-bottom: 12px;
      color: #7c5cff;
    }

    p {
      color: #aaa;
      margin-bottom: 25px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #7c5cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .button:hover {
      background: #6848e8;
    }

    .key {
      margin-top: 20px;
      padding: 15px;
      background: #0d0d12;
      border-radius: 10px;
      word-break: break-all;
      color: #7cffa8;
    }

    .copy {
      margin-top: 12px;
      background: #252532;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🔑 Key System</h1>

    <p id="message">
      Clique abaixo para obter sua Key.
    </p>

    <!-- TROQUE O LINK ABAIXO PELO SEU LINK DO SHRINKME -->
    <a
      class="button"
      href="SEU_LINK_DO_SHRINKME"
    >
      Pegar Key
    </a>

  </div>

</body>
</html>
